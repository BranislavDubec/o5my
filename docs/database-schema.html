<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O5MY database schema</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111827; color: #f9fafb; }
    header { padding: 18px 22px; border-bottom: 1px solid #374151; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: #9ca3af; }
    main { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 82px); }
    nav { padding: 16px; border-right: 1px solid #374151; }
    nav button { width: 100%; margin: 0 0 8px; padding: 11px 12px; border: 0; border-radius: 7px; background: transparent; color: inherit; text-align: left; cursor: pointer; font: inherit; }
    nav button:hover { background: #1f2937; }
    nav button[aria-selected="true"] { background: #2563eb; color: white; }
    section { min-width: 0; padding: 16px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .actions button { padding: 7px 10px; border: 1px solid #4b5563; border-radius: 6px; background: #1f2937; color: inherit; cursor: pointer; font: inherit; }
    h2 { margin: 0; font-size: 17px; }
    a { color: #93c5fd; }
    .canvas { height: calc(100vh - 145px); min-height: 500px; overflow: auto; border-radius: 8px; background: white; }
    .canvas img { display: block; width: 100%; max-width: none; height: auto; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      nav { display: flex; gap: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid #374151; }
      nav button { width: auto; min-width: max-content; margin: 0; }
      .canvas { height: 70vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>O5MY database schema</h1>
    <p>Choose a smaller area to see every column and relationship clearly.</p>
  </header>
  <main>
    <nav aria-label="Schema sections" id="schema-navigation"></nav>
    <section>
      <div class="toolbar">
        <h2 id="diagram-title">Overview</h2>
        <div class="actions">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-reset" type="button">100%</button>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <a id="open-svg" href="database-schema/overview.svg" target="_blank" rel="noreferrer">Open SVG</a>
        </div>
      </div>
      <div class="canvas">
        <img id="diagram" src="database-schema/overview.svg" alt="Database schema overview">
      </div>
    </section>
  </main>
  <script>
    const diagrams = [
      ["Overview", "overview"],
      ["Users & authentication", "users-auth"],
      ["Events & matches", "events-matches"],
      ["Polls", "polls"],
      ["Finance & banking", "finance"],
      ["Team & media", "team-media"],
    ];
    const navigation = document.getElementById("schema-navigation");
    const title = document.getElementById("diagram-title");
    const diagram = document.getElementById("diagram");
    const openSvg = document.getElementById("open-svg");
    const zoomReset = document.getElementById("zoom-reset");
    let zoom = 100;

    function setZoom(nextZoom) {
      zoom = Math.min(250, Math.max(50, nextZoom));
      diagram.style.width = `${zoom}%`;
      zoomReset.textContent = `${zoom}%`;
    }

    document.getElementById("zoom-out").addEventListener("click", () => setZoom(zoom - 25));
    document.getElementById("zoom-in").addEventListener("click", () => setZoom(zoom + 25));
    zoomReset.addEventListener("click", () => setZoom(100));

    diagrams.forEach(([label, file], index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("aria-selected", index === 0 ? "true" : "false");
      button.addEventListener("click", () => {
        navigation.querySelectorAll("button").forEach((item) => item.setAttribute("aria-selected", "false"));
        button.setAttribute("aria-selected", "true");
        const source = `database-schema/${file}.svg`;
        title.textContent = label;
        diagram.src = source;
        diagram.alt = `${label} database diagram`;
        openSvg.href = source;
        setZoom(100);
      });
      navigation.appendChild(button);
    });
  </script>
</body>
</html>
